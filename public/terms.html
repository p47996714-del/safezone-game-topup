<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms & Privacy - Safe Zone</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0b1120;color:#fff;padding:20px;line-height:1.7;max-width:800px;margin:0 auto}
  h1{color:#38bdf8;margin-bottom:20px;font-size:22px}
  h2{color:#a855f7;margin:25px 0 12px;font-size:17px}
  p{color:#cbd5e1;margin-bottom:12px;font-size:14px;white-space:pre-wrap}
  .card{background:rgba(30,41,59,0.6);padding:22px;border-radius:16px;border:1px solid #334155;margin-bottom:20px}
  .back{display:inline-block;padding:10px 20px;background:linear-gradient(135deg,#38bdf8,#a855f7);color:#fff;text-decoration:none;border-radius:12px;font-weight:bold;margin-top:20px}
  .updated{font-size:12px;color:#64748b;margin-bottom:15px}
</style>
</head>
<body>
<h1>📜 Terms & Privacy</h1>
<div class="updated">နောက်ဆုံးပြင်ဆင်ချိန်: <span id="upd"></span></div>
<div class="card"><h2>📋 Terms of Service</h2><p id="terms">Loading...</p></div>
<div class="card"><h2>🔐 Privacy Policy</h2><p id="privacy">Loading...</p></div>
<a href="/" class="back">🔙 Back to Home</a>
<script>
document.getElementById('upd').textContent = new Date().toLocaleDateString('en-GB', {day:'2-digit',month:'long',year:'numeric'});
fetch('/api/terms').then(r=>r.json()).then(d=>{
  document.getElementById('terms').textContent = d.terms;
  document.getElementById('privacy').textContent = d.privacy;
}).catch(()=>{
  document.getElementById('terms').textContent = 'Error loading terms';
});
</script>
</body>
</html>
