<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Admin Panel — Safe Zone</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>🛡️ Admin Panel</h1>
    <p>Safe Zone Game Topup</p>
    <input id="pwd" type="password" placeholder="Admin Password" />
    <button id="loginBtn">🔓 Login</button>
    <div id="loginError" class="login-error hidden"></div>
  </div>
</div>

<div id="adminScreen" class="admin-screen hidden">
  <header class="admin-header">
    <div class="logo">🛡️ Safe Zone Admin</div>
    <div class="header-actions">
      <button id="toggleAppBtn" class="btn-toggle">...</button>
      <button id="backupBtn" class="btn-backup">💾 Backup</button>
      <button id="logoutBtn" class="btn-logout">🚪</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="dash">📊 Dashboard</button>
    <button class="tab" data-tab="deposits">📥 Deposits</button>
    <button class="tab" data-tab="orders">🛒 Orders</button>
    <button class="tab" data-tab="users">👥 Users</button>
    <button class="tab" data-tab="items">🧾 Items</button>
    <button class="tab" data-tab="chats">💬 Chats</button>
    <button class="tab" data-tab="logs">📜 Logs</button>
  </div>

  <main class="admin-main">
    <section id="tab-dash" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-val" id="sUsers">0</div><div class="stat-label">Users</div></div>
        <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-val" id="sBalance">0</div><div class="stat-label">Total Balance</div></div>
        <div class="stat-card"><div class="stat-icon">📥</div><div class="stat-val" id="sPendingDep">0</div><div class="stat-label">Pending Deposits</div></div>
        <div class="stat-card"><div class="stat-icon">🛒</div><div class="stat-val" id="sPendingOrd">0</div><div class="stat-label">Pending Orders</div></div>
        <div class="stat-card"><div class="stat-icon">💵</div><div class="stat-val" id="sTotalDep">0</div><div class="stat-label">Approved Deposits</div></div>
        <div class="stat-card"><div class="stat-icon">🧾</div><div class="stat-val" id="sSales">0</div><div class="stat-label">Total Sales</div></div>
        <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-val" id="sItems">0</div><div class="stat-label">Items</div></div>
        <div class="stat-card"><div class="stat-icon">💬</div><div class="stat-val" id="sChats">0</div><div class="stat-label">Unread Chats</div></div>
      </div>
    </section>

    <section id="tab-deposits" class="tab-content">
      <div class="filter-bar">
        <button class="filter active" data-status="pending">Pending</button>
        <button class="filter" data-status="approved">Approved</button>
        <button class="filter" data-status="rejected">Rejected</button>
        <button class="filter" data-status="all">All</button>
      </div>
      <div id="depositsList" class="list"></div>
    </section>

    <section id="tab-orders" class="tab-content">
      <div class="filter-bar">
        <button class="filter active" data-status="pending">Pending</button>
        <button class="filter" data-status="completed">Completed</button>
        <button class="filter" data-status="rejected">Rejected</button>
        <button class="filter" data-status="all">All</button>
      </div>
      <div id="ordersList" class="list"></div>
    </section>

    <section id="tab-users" class="tab-content">
      <div class="filter-bar">
        <input id="userSearch" type="text" placeholder="🔍 နာမည် / ဖုန်း ရှာ..." />
      </div>
      <div id="usersList" class="list"></div>
    </section>

    <section id="tab-items" class="tab-content">
      <div class="filter-bar">
        <button id="addItemBtn" class="btn-primary">➕ Item အသစ်</button>
      </div>
      <div id="itemsList" class="list"></div>
    </section>

    <section id="tab-chats" class="tab-content">
      <div id="chatsList" class="list"></div>
    </section>

    <section id="tab-logs" class="tab-content">
      <div id="logsList" class="list"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-x" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="admin.js"></script>
</body>
</html>
