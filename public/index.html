<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1120">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Safe Zone">
<link rel="apple-touch-icon" href="https://i.imgur.com/iRwIfqs.png">
<title>Login - Safe Zone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 20% 20%,#1e3a8a 0%,#0b1120 50%),radial-gradient(circle at 80% 80%,#7c3aed 0%,transparent 50%);background-color:#0b1120;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
body.light{background:#f1f5f9;color:#0f172a}
body::before{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,#38bdf833,transparent);border-radius:50%;top:-100px;right:-100px;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(20px)}}
.box{background:rgba(30,41,59,0.7);backdrop-filter:blur(20px);padding:35px 28px;border-radius:24px;width:100%;max-width:400px;border:1px solid rgba(56,189,248,0.2);box-shadow:0 20px 60px rgba(0,0,0,0.6);position:relative;z-index:1;animation:slideUp 0.5s ease}
body.light .box{background:rgba(255,255,255,0.8);border-color:#cbd5e1;color:#0f172a}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;margin-bottom:25px}
.logo-icon{font-size:48px;margin-bottom:8px;display:inline-block;animation:spin 3s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
h1{text-align:center;font-size:22px;font-weight:bold}
h1 span{background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{text-align:center;color:#94a3b8;font-size:12px;margin-top:5px}
.field{position:relative;margin-bottom:12px}
input{width:100%;padding:14px 44px 14px 16px;border-radius:14px;border:1px solid #334155;background:rgba(15,23,42,0.7);color:#fff;font-size:15px;transition:0.2s}
body.light input{background:#fff;border-color:#cbd5e1;color:#0f172a}
input:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,0.15)}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:16px;padding:6px}
button.main{width:100%;padding:14px;background:linear-gradient(135deg,#38bdf8,#a855f7);color:#fff;border:none;border-radius:14px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:5px;box-shadow:0 8px 20px rgba(56,189,248,0.3);transition:transform 0.1s;position:relative;overflow:hidden}
button.main:active{transform:scale(0.97)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.5);transform:scale(0);animation:ripple 0.6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.switch{text-align:center;margin-top:18px;color:#94a3b8;font-size:14px}
.switch a{color:#38bdf8;text-decoration:none;cursor:pointer;font-weight:bold}
.msg{padding:12px;border-radius:12px;margin-bottom:12px;font-size:14px;display:none;text-align:center}
.err{background:#7f1d1d;color:#fecaca}
.ok{background:#064e3b;color:#86efac}
.hint{font-size:11px;color:#64748b;margin-bottom:12px;padding-left:4px}
.maint{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#1e293b,#0b1120);z-index:9999;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;flex-direction:column}
.maint.show{display:flex}
.maint-icon{font-size:80px;margin-bottom:20px;animation:spin 4s linear infinite}
.maint h2{font-size:24px;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:15px}
.maint p{color:#cbd5e1;font-size:15px;line-height:1.6;max-width:400px}
.splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#1e293b,#0b1120);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s,visibility 0.6s}
.splash.hide{opacity:0;visibility:hidden}
.splash-logo{font-size:90px;line-height:1;animation:splashIn 1s ease-out;filter:drop-shadow(0 0 30px rgba(56,189,248,0.5));position:relative;font-weight:bold}
.splash-logo::after{content:'';position:absolute;inset:-35px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,0.25),transparent 70%);animation:glowPulse 2.5s ease-in-out infinite;z-index:-1}
@keyframes splashIn{0%{opacity:0;transform:scale(0.85)}100%{opacity:1;transform:scale(1)}}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.15);opacity:0.85}}
.splash-title{margin-top:35px;font-size:26px;font-weight:bold;background:linear-gradient(135deg,#38bdf8,#a855f7,#ec4899);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradShift 2s ease infinite,fadeUp 0.8s 0.3s backwards}
@keyframes gradShift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.splash-sub{margin-top:8px;font-size:13px;color:#94a3b8;letter-spacing:3px;animation:fadeUp 0.8s 0.6s backwards}
.splash-loader{margin-top:40px;width:180px;height:4px;background:#1e293b;border-radius:4px;overflow:hidden;animation:fadeUp 0.8s 0.9s backwards}
.splash-bar{height:100%;background:linear-gradient(90deg,#38bdf8,#a855f7,#ec4899);border-radius:4px;animation:loadBar 2s ease-in-out forwards}
@keyframes loadBar{0%{width:0}100%{width:100%}}
.splash-stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.splash-star{position:absolute;color:#38bdf8;font-size:14px;opacity:0.6;animation:twinkle 2s infinite}
@keyframes twinkle{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
.theme-btn{position:fixed;top:15px;right:15px;background:rgba(30,41,59,0.8);border:1px solid #334155;color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;z-index:100}
#otpForm{display:none}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-stars">
    <span class="splash-star" style="top:15%;left:20%;animation-delay:0s">✦</span>
    <span class="splash-star" style="top:25%;right:18%;animation-delay:0.3s">✦</span>
    <span class="splash-star" style="bottom:20%;left:15%;animation-delay:0.6s">✦</span>
    <span class="splash-star" style="bottom:30%;right:22%;animation-delay:0.9s">✦</span>
    <span class="splash-star" style="top:10%;right:35%;animation-delay:1.2s">✦</span>
  </div>
  <div class="splash-logo"><img src="https://i.imgur.com/iRwIfqs.png" style="width:140px;height:140px;object-fit:contain"></div>
  <div class="splash-title">SAFE ZONE</div>
  <div class="splash-sub">GAME TOPUP</div>
  <div class="splash-loader"><div class="splash-bar"></div></div>
</div>

<button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>

<div class="maint" id="maint">
  <div class="maint-icon">🔧</div>
  <h2>Website ပြုပြင်နေပါသည်</h2>
  <p id="maintMsg">မကြာမီ ပြန်လည် ဖွင့်ပေးပါမည်။</p>
</div>

<div class="box" id="mainBox">
  <div class="logo"><div class="logo-icon"><img src="https://i.imgur.com/iRwIfqs.png" style="width:140px;height:140px;object-fit:contain"></div><h1><span>Safe Zone</span></h1><div class="subtitle">Game Topup Platform</div></div>
  <div id="msg" class="msg"></div>

  <div id="loginForm">
    <div class="field"><input id="lu" placeholder="Username"></div>
    <div class="field"><input id="lp" type="password" placeholder="Password"><button class="toggle-pw" onclick="togglePw('lp',this)">👁</button></div>
    <button class="main" onclick="login(event)">🔐 Login</button>
    <div class="switch">Account မရှိဘူးလား? <a onclick="show('reg')">Register</a></div>
  </div>

  <div id="otpForm">
    <div style="text-align:center;margin-bottom:15px;font-size:14px;color:#94a3b8">📱 Telegram ဆီ OTP ပို့ပြီးပါပြီ</div>
    <div class="field"><input id="otpInput" placeholder="6-digit OTP" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:8px;padding:16px"></div>
    <button class="main" onclick="verifyOTP(event)">✅ Verify</button>
    <div class="switch"><a onclick="show('login')">🔙 Back</a></div>
  </div>

  <div id="regForm" style="display:none">
    <div class="field"><input id="ru" placeholder="Username"></div>
    <div class="field"><input id="rp" type="password" placeholder="Password" oninput="checkStrength()"><button class="toggle-pw" onclick="togglePw('rp',this)">👁</button></div>
    <div id="strengthBar" class="hint"></div>
    <div class="field"><input id="rp2" type="password" placeholder="Password ထပ်ရိုက်ပါ"><button class="toggle-pw" onclick="togglePw('rp2',this)">👁</button></div>
    <div class="field"><input id="rph" placeholder="Phone (09xxxxxxxxx)"></div>
    <div class="field"><input id="rref" placeholder="Referral Code (optional)"></div>
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#94a3b8;margin-bottom:12px">
      <input type="checkbox" id="rterms" style="width:auto;padding:0">
      <label for="rterms"><a href="/terms.html" target="_blank" style="color:#38bdf8">Terms & Privacy</a> လက်ခံပါ</label>
    </div>
    <button class="main" onclick="register(event)">✨ Register</button>
    <div class="switch">Account ရှိပြီးသားလား? <a onclick="show('login')">Login</a></div>
  </div>
</div>

<script>
setTimeout(() => {
  const s = document.getElementById('splash');
  if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 700); }
}, 2200);

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSound(type){
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'success') { osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1); }
    else if (type === 'error') { osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.2); }
    else { osc.frequency.setValueAtTime(600, audioCtx.currentTime); }
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } catch(e){}
}
function haptic(ms){ if (navigator.vibrate) navigator.vibrate(ms || 30); }

document.addEventListener('click', e => {
  const btn = e.target.closest('button.main');
  if (!btn) return;
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left - size/2) + 'px';
  r.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(r);
  setTimeout(() => r.remove(), 600);
  haptic(20);
});

if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light'); document.getElementById('themeBtn').textContent = '☀️'; }
function toggleTheme(){
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('theme', isLight ? 'light' : 'dark');
  haptic(20);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

async function checkMaint(){
  try {
    const d = await (await fetch('/api/maintenance')).json();
    if (d.enabled) {
      document.getElementById('maintMsg').textContent = d.message || 'မကြာမီ ပြန်လည် ဖွင့်ပေးပါမည်။';
      document.getElementById('maint').classList.add('show');
      document.getElementById('mainBox').style.display = 'none';
      return true;
    } else {
      document.getElementById('maint').classList.remove('show');
      document.getElementById('mainBox').style.display = 'block';
      return false;
    }
  } catch(e){ return false; }
}
(async () => {
  const m = await checkMaint();
  if (!m && localStorage.getItem('token')) location.href = '/app.html';
})();
setInterval(checkMaint, 30000);

function show(v){
  document.getElementById('loginForm').style.display = v==='login'?'block':'none';
  document.getElementById('regForm').style.display = v==='reg'?'block':'none';
  document.getElementById('otpForm').style.display = v==='otp'?'block':'none';
  document.getElementById('msg').style.display='none';
}
function msg(t, ok){ const m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); m.style.display='block'; playSound(ok?'success':'error'); }
function togglePw(id, btn){
  const el = document.getElementById(id);
  if (el.type === 'password') { el.type = 'text'; btn.textContent = '🙈'; }
  else { el.type = 'password'; btn.textContent = '👁'; }
}
function checkStrength(){
  const p = document.getElementById('rp').value;
  const bar = document.getElementById('strengthBar');
  if (!p) { bar.textContent = ''; return; }
  let score = 0;
  if (p.length >= 6) score++; if (p.length >= 10) score++;
  if (/[A-Z]/.test(p)) score++; if (/[0-9]/.test(p)) score++; if (/[^A-Za-z0-9]/.test(p)) score++;
  const txt = ['😟 အားနည်း','😐 အားနည်း','🙂 အလယ်','😊 ကောင်း','😎 အားကောင်း','🔥 အားကောင်း'][score];
  const color = ['#ef4444','#f59e0b','#eab308','#22c55e','#10b981','#38bdf8'][score];
  bar.textContent = txt; bar.style.color = color;
}

let loginData = {};
async function login(e){
  if (e) e.preventDefault();
  const u = lu.value.trim(), p1 = lp.value;
  if (!u || !p1) return msg('Username / Password ဖြည့်ပါ');
  loginData = { username: u, password: p1 };
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(loginData)});
  const d = await r.json();
  if (d.maintenance) { checkMaint(); return; }
  if (d.needOTP) { show('otp'); msg('📱 OTP ကို Telegram ဆီ ပို့ပြီးပါပြီ', true); return; }
  if (d.success){ finishLogin(d); } else msg('❌ ' + d.error);
}
async function verifyOTP(e){
  if (e) e.preventDefault();
  const otp = document.getElementById('otpInput').value.trim();
  if (otp.length !== 6) return msg('6-digit OTP ဖြည့်ပါ');
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({...loginData, otp})});
  const d = await r.json();
  if (d.success) finishLogin(d); else msg('❌ ' + d.error);
}
function finishLogin(d){
  localStorage.setItem('token',d.token); localStorage.setItem('username',d.username);
  playSound('success'); haptic(50);
  setTimeout(() => location.href='/app.html', 300);
}
async function register(e){
  if (e) e.preventDefault();
  const u = ru.value.trim(), p1 = rp.value, p2 = rp2.value;
  if (!u || !p1) return msg('ဖြည့်ပါ');
  if (p1.length < 6) return msg('❌ Password အနည်းဆုံး ၆ လုံး');
  if (!document.getElementById('rterms').checked) return msg('❌ Terms လက်ခံပါ');
  const r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p1,phone:rph.value,referral:rref.value.trim()})});
  const d = await r.json();
  if (d.maintenance) { checkMaint(); return; }
  if (d.success){ msg('✅ Register အောင်မြင်! Login ဝင်ပါ', true); setTimeout(()=>show('login'),1200); }
  else msg('❌ ' + d.error);
}
</script>
</body>
</html>
